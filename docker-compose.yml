version: '3.8'

services:
  getway:
    build:
      context: ./getway
      dockerfile: Dockerfile

    container_name: getway
    ports:
      - "8000:8000"

    environment:
      - APP_HOST=0.0.0.0
      - APP_PORT=8000
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4317
      - OTEL_SERVICE_NAME=api-gateway
      - SERVICE_VERSION=1.0.0
      - ENVIRONMENT=development
      - PYTHONUNBUFFERED=1

    restart: always

    depends_on:
      - user-service

    networks:
      - coffee-shop

  user-service:
    build:
      context: ./authService
      dockerfile: Dockerfile

    environment:
      - OTEL_EXPORTER_OTLP_ENDPOINT=jaeger:4317
      - OTEL_SERVICE_NAME=user-service

    container_name: authService
    ports:
      - "8080:8080"

    restart: always

    depends_on:
      - postgres-user-service

    networks:
      - coffee-shop


  postgres-user-service:
    image: postgres:15-alpine
    container_name: user-service-db

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: users_db

    ports:
      - "5433:5432"

    volumes:
      - ./authService/migrations:/docker-entrypoint-initdb.d

    restart: unless-stopped

    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d users_db" ]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - coffee-shop

  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: jaeger
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    ports:
      - "16686:16686" # Веб-интерфейс Jaeger UI
      - "4317:4317"   # Порт для приема трасс по OTLP gRPC
      - "4318:4318"   # Порт для приема трасс по OTLP HTTP
    networks:
      - coffee-shop


networks:
  coffee-shop:
    driver: bridge